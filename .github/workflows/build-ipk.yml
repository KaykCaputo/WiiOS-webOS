name: Build IPK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install test dependencies
        run: |
          npm ci --ignore-scripts
          python3 -m pip install -r requirements-dev.txt

      - name: Test application, installer, and Home recovery
        run: npm test

      - name: Build release assets
        run: |
          python3 -m scripts.prepare_release --build --output dist \
            --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA"

      - name: Verify release assets
        working-directory: dist
        run: |
          sha256sum --check --strict *.sha256

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: wiios-ipk-${{ github.sha }}
          path: |
            dist/*.ipk
            dist/*.ipk.sha256
            dist/*.pyz
            dist/*.pyz.sha256
            dist/build-manifest.json
            dist/com.wiios.launcher*.manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    concurrency:
      group: wiios-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: wiios-ipk-${{ github.sha }}
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("appinfo.json"))["version"])')
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          ASSETS=(release-assets/*.ipk release-assets/*.ipk.sha256
                  release-assets/*.pyz release-assets/*.pyz.sha256
                  release-assets/build-manifest.json release-assets/com.wiios.launcher*.manifest.json)
          NOTES=$(mktemp)
          trap 'rm -f "$NOTES"' EXIT
          python3 -m scripts.release_notes "$GITHUB_REPOSITORY" "$TAG" "$GITHUB_SHA" > "$NOTES"
          gh release create "$TAG" "${ASSETS[@]}" \
            --target "$GITHUB_SHA" --title "WiiOS $VERSION" --notes-file "$NOTES"

